name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Manual dispatch runs the FULL suite (slow/e2e included) — see CHECK_MODE.
  workflow_dispatch:

# One run per branch: a new push supersedes and cancels the previous run, and
# PR branches no longer double-run via the push trigger.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run static and source-integrity checks
        env:
          CHECK_DIFF_RANGE: ${{ github.event_name == 'pull_request' && format('{0}...HEAD', github.event.pull_request.base.sha) || 'HEAD~1..HEAD' }}
        run: uv run scripts/check --fast --skip-pytest

  fast_tests:
    if: github.event_name != 'workflow_dispatch'
    name: fast_tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            index: 0
          - shard: 2
            index: 1
          - shard: 3
            index: 2
          - shard: 4
            index: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run fast-test shard
        env:
          PYTEST_SHARD_INDEX: ${{ matrix.index }}
          PYTEST_SHARD_TOTAL: 4
        run: |
          uv run python -m pytest -q \
            -p scripts.pytest_shard \
            -m "not slow and not e2e and not llm and not pmml_runtime"

  full_checks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run full release checks
        run: |
          base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          if [ -n "$base" ] && [ "$base" != "$(git rev-parse HEAD)" ]; then
            export CHECK_DIFF_RANGE="${base}...HEAD"
          fi
          uv run scripts/check

  checks:
    if: always()
    needs: [quality, fast_tests, full_checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the applicable verification lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          FAST_TESTS_RESULT: ${{ needs.fast_tests.result }}
          FULL_CHECKS_RESULT: ${{ needs.full_checks.result }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$FULL_CHECKS_RESULT" = "success"
          else
            test "$QUALITY_RESULT" = "success"
            test "$FAST_TESTS_RESULT" = "success"
          fi

  strategy_smoke:
    # Manual dispatch already exercises these tests in the unfiltered full
    # suite. PRs and main pushes keep a small end-to-end strategy product gate
    # in parallel with fast unit feedback and the separate JVM lane.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run strategy product smoke tests
        run: |
          uv run python -m pytest -q \
            tests/test_strategy_candidate_request_e2e.py::test_natural_language_candidate_auto_runs_to_only_adoption_gate_and_rerenders_doc \
            tests/test_strategy_standard_workflows_e2e.py::test_natural_language_standard_workflow_executes_and_exports \
            tests/test_strategy_monitoring_e2e.py::test_strategy_monitoring_e2e_red_then_new_version_then_report

  pmml_runtime:
    # The manual dispatch already runs the unfiltered suite in `checks`.
    # PRs and main pushes keep this JVM-heavy coverage, but execute it in
    # parallel with the fast feedback gate instead of extending its duration.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run PMML/JVM runtime tests
        run: uv run python -m pytest -q -m pmml_runtime

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocking gate: pip-audit has zero known CVEs and every bandit medium
    # finding was triaged as a false positive in the 2026-07-03 FIN-2 security
    # review (docs/reviews/2026-07-03-fin2-fin3-closing-review.md) — bandit
    # below fails on high-severity findings only, matching that adjudication.
    continue-on-error: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: pip-audit (dependency CVE scan)
        run: uv tool run pip-audit

      - name: bandit (high-severity static security scan)
        run: uv tool run bandit -r marvis -lll
