name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Manual dispatch runs the FULL suite (slow/e2e included) — see CHECK_MODE.
  workflow_dispatch:

# Keep push/PR feedback and manually requested full regression independent.
# Newer runs still supersede older runs of the same event type on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run static and source-integrity checks
        env:
          CHECK_DIFF_RANGE: ${{ github.event_name == 'pull_request' && format('{0}...HEAD', github.event.pull_request.base.sha) || 'HEAD~1..HEAD' }}
        run: uv run scripts/check --fast --skip-pytest

  fast_tests:
    if: github.event_name != 'workflow_dispatch'
    name: fast_tests (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    # Four shards approached two hours; split work without raising timeouts.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            index: 0
          - shard: 2
            index: 1
          - shard: 3
            index: 2
          - shard: 4
            index: 3
          - shard: 5
            index: 4
          - shard: 6
            index: 5
          - shard: 7
            index: 6
          - shard: 8
            index: 7

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run fast-test shard
        env:
          PYTEST_SHARD_INDEX: ${{ matrix.index }}
          PYTEST_SHARD_TOTAL: 8
        run: |
          uv run python -m pytest -q --durations=25 \
            -p scripts.pytest_shard \
            -m "not slow and not e2e and not llm and not pmml_runtime"

  full_checks:
    if: github.event_name == 'workflow_dispatch'
    name: full_checks (${{ matrix.index }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run full release checks
        env:
          MARVIS_RUN_PLAYWRIGHT_SMOKE: "1"
          PYTEST_SHARD_INDEX: ${{ matrix.index }}
          PYTEST_SHARD_TOTAL: 8
        run: |
          base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
          if [ -n "$base" ] && [ "$base" != "$(git rev-parse HEAD)" ]; then
            export CHECK_DIFF_RANGE="${base}...HEAD"
          fi
          uv run scripts/check -- -q --durations=25 -p scripts.pytest_shard

  checks:
    # A superseded run is expected cancellation, not a failed verification.
    # For completed runs, aggregate every gate that applies to the event.
    if: ${{ !cancelled() }}
    needs:
      [quality, fast_tests, full_checks, strategy_smoke, browser_smoke, pmml_runtime, security, macos_native_isolation]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the applicable verification lanes
        env:
          EVENT_NAME: ${{ github.event_name }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          FAST_TESTS_RESULT: ${{ needs.fast_tests.result }}
          FULL_CHECKS_RESULT: ${{ needs.full_checks.result }}
          STRATEGY_SMOKE_RESULT: ${{ needs.strategy_smoke.result }}
          BROWSER_SMOKE_RESULT: ${{ needs.browser_smoke.result }}
          PMML_RUNTIME_RESULT: ${{ needs.pmml_runtime.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          MACOS_NATIVE_ISOLATION_RESULT: ${{ needs.macos_native_isolation.result }}
        run: |
          test "$SECURITY_RESULT" = "success"
          test "$MACOS_NATIVE_ISOLATION_RESULT" = "success"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$FULL_CHECKS_RESULT" = "success"
            test "$QUALITY_RESULT" = "skipped"
            test "$FAST_TESTS_RESULT" = "skipped"
            test "$STRATEGY_SMOKE_RESULT" = "skipped"
            test "$BROWSER_SMOKE_RESULT" = "skipped"
            test "$PMML_RUNTIME_RESULT" = "skipped"
          else
            test "$FULL_CHECKS_RESULT" = "skipped"
            test "$QUALITY_RESULT" = "success"
            test "$FAST_TESTS_RESULT" = "success"
            test "$STRATEGY_SMOKE_RESULT" = "success"
            test "$BROWSER_SMOKE_RESULT" = "success"
            test "$PMML_RUNTIME_RESULT" = "success"
          fi

  strategy_smoke:
    # Manual dispatch already exercises these tests in the unfiltered full
    # suite. PRs and main pushes keep a small end-to-end strategy product gate
    # in parallel with fast unit feedback and the separate JVM lane.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run strategy product smoke tests
        run: |
          uv run python -m pytest -q \
            tests/test_strategy_candidate_request_e2e.py::test_natural_language_candidate_auto_runs_to_only_adoption_gate_and_rerenders_doc \
            tests/test_strategy_standard_workflows_e2e.py::test_natural_language_standard_workflow_executes_and_exports \
            tests/test_strategy_monitoring_e2e.py::test_strategy_monitoring_e2e_red_then_new_version_then_report

  browser_smoke:
    # PRs and main pushes run a real Chromium smoke lane. The broader browser
    # and product E2E suite remains part of the manually dispatched full gate.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run browser smoke tests
        env:
          MARVIS_RUN_PLAYWRIGHT_SMOKE: "1"
        run: uv run python -m pytest -q tests/test_frontend_playwright_smoke.py

  pmml_runtime:
    # The manual dispatch already runs the unfiltered suite in `checks`.
    # PRs and main pushes keep this JVM-heavy coverage, but execute it in
    # parallel with the fast feedback gate instead of extending its duration.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run PMML/JVM runtime tests
        run: uv run python -m pytest -q -m pmml_runtime

  macos_native_isolation:
    # Linux runners skip every native Seatbelt test, so a green Ubuntu run says
    # nothing about the macOS isolation boundary. This lane runs them on macOS
    # and fails if any of them is skipped: a skip is not a pass here.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Register the default Jupyter kernel
        run: uv run python -m ipykernel install --user --name python3

      - name: Run native isolation tests (skips fail the lane)
        run: |
          uv run python -m pytest -v -rs --tb=short -x \
            --junitxml=native-isolation.xml \
            tests/test_local_execution_network.py \
            tests/test_local_execution_journeys.py \
            tests/test_native_worker_isolation.py \
            "tests/test_notebooks.py" -k "loopback or test_local_execution_network or test_local_execution_journeys or test_native_worker_isolation"
          uv run python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("native-isolation.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"native isolation: {tests} tests, {skipped} skipped")
          if tests == 0 or skipped:
              sys.exit("native isolation tests must run on macOS; skipped tests do not count as passes")
          PY

      - name: Diagnose native socket failures without changing the test verdict
        if: failure()
        timeout-minutes: 4
        run: uv run python scripts/diagnose_native_network.py --output native-network-diagnostics.json

      - name: Preserve native isolation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-isolation-diagnostics
          path: |
            native-isolation.xml
            native-network-diagnostics.json
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocking gate: pip-audit must report zero known CVEs. Bandit's reviewed
    # medium/high findings are pinned in a baseline, so historical false
    # positives stay documented without silently accepting new findings.
    continue-on-error: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: pip-audit (dependency CVE scan)
        # Scan the pinned project graph rather than pip-audit's isolated tool
        # environment. The exported hashes prevent a second resolver from
        # silently selecting a different set of packages.
        run: >-
          uv export --locked --all-extras --all-groups --no-emit-project --format requirements.txt
          | uv tool run --from pip-audit==2.10.1 pip-audit --require-hashes --disable-pip -r /dev/stdin

      - name: bandit (new medium/high findings)
        run: uv tool run --from bandit==1.9.4 bandit -r marvis -ll -ii -b .bandit-baseline.json
